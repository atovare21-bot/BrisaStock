spring.application.name=BrisaStock

# Conexion MySQL/MariaDB
# Cada valor se puede definir con una variable de entorno (ver README.md).
# Si la variable no existe se usa el valor de desarrollo local de siempre,
# asi que la instalacion local actual sigue funcionando sin configurar nada.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/brisastock_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# 'update' (por defecto) agrega tablas/columnas nuevas; JPA_DDL_AUTO=validate solo verifica el esquema.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
# Las consultas SQL NO se imprimen por defecto; para depurar: SHOW_SQL=true
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Puerto
server.port=9090

# Swagger / OpenAPI: solo accesibles para un ADMIN autenticado (ver SecurityConfig).
# Para apagarlos por completo (p. ej. en produccion): SWAGGER_ENABLED=false
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}