<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BrisaStock · Inventario</title>
  <meta name="description" content="Gestión de inventario y ventas para pequeños negocios.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e7c86'/%3E%3Cpath d='M8 21h16M8 15h11M8 9h16' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <a class="saltar" href="#vista">Saltar al contenido</a>
  <div class="barra-carga" aria-hidden="true"></div>

  <!-- Inicio de sesión -->
  <main id="login" class="login" hidden>
    <section class="login__panel" aria-labelledby="login-titulo">
      <div class="marca marca--grande">
        <span class="marca__logo" aria-hidden="true"></span>
        <span class="marca__nombre">BrisaStock</span>
      </div>
      <h1 id="login-titulo">Inicia sesión</h1>
      <p class="login__ayuda">Usa el usuario y la contraseña que te dio el administrador de tu negocio.</p>
      <form id="form-login" novalidate>
        <div class="campo">
          <label for="login-usuario">Usuario</label>
          <input id="login-usuario" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="campo">
          <label for="login-clave">Contraseña</label>
          <input id="login-clave" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p id="login-error" class="mensaje mensaje--error" role="alert" hidden></p>
        <button class="btn btn--primario btn--ancho" type="submit">Entrar</button>
      </form>
      <button id="btn-accesibilidad-login" class="btn btn--texto login__accesibilidad" type="button">Letra más grande y otras opciones</button>
    </section>
    <aside class="login__lado" aria-hidden="true">
      <p>Cada producto con su stock mínimo, cada movimiento con su responsable.</p>
    </aside>
  </main>

  <!-- Aplicación -->
  <div id="app" class="app" hidden>
    <aside id="lateral" class="lateral" aria-label="Navegación principal">
      <div class="marca">
        <span class="marca__logo" aria-hidden="true"></span>
        <span class="marca__nombre">BrisaStock</span>
      </div>
      <nav id="menu" class="menu"></nav>
    </aside>
    <div id="velo" class="velo" hidden></div>

    <div class="cuerpo">
      <header class="superior">
        <button id="btn-menu" class="btn btn--icono menu-movil" type="button" aria-label="Abrir menú" aria-controls="lateral" aria-expanded="false"></button>
        <h1 id="titulo-vista" class="superior__titulo"></h1>
        <div class="superior__acciones">
          <button id="btn-buscar" class="btn btn--suave btn--busqueda" type="button" aria-label="Búsqueda rápida" aria-keyshortcuts="Control+K" title="Búsqueda rápida (Ctrl + K)">
            <span class="solo-ancho">Buscar</span><kbd class="solo-ancho">Ctrl K</kbd>
          </button>
          <button id="btn-accesibilidad" class="btn btn--suave" type="button" aria-label="Opciones de accesibilidad" title="Accesibilidad: tamaño de letra y contraste">
            <span class="solo-ancho">Accesibilidad</span>
          </button>
        </div>
        <div class="superior__usuario">
          <div class="superior__datos">
            <span id="usuario-nombre"></span>
            <small id="usuario-rol"></small>
          </div>
          <button id="btn-salir" class="btn btn--suave" type="button" aria-label="Cerrar sesión"><span class="solo-ancho">Cerrar sesión</span><span class="solo-estrecho">Salir</span></button>
        </div>
      </header>
      <main id="vista" class="vista" tabindex="-1"></main>
    </div>
  </div>

  <div id="avisos" class="avisos" aria-live="polite" aria-atomic="false"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
