# ---------------------------------------------------------------------------
# CONFIGURACIÓN SOLO PARA PRUEBAS.
# Este archivo reemplaza a src/main/resources/application.properties durante
# los tests, de modo que NUNCA se use la base de datos real (brisastock_db).
# Los tests usan H2 en memoria, que desaparece al terminar.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:brisastock_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
