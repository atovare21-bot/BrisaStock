<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
  <title id="t">Ilustración de referencia del inicio de sesión</title>
  <desc id="d">Composición orientativa de la pantalla de acceso de BrisaStock, sin datos reales.</desc>
  <rect width="1280" height="720" fill="#f2f5f6"/>
  <rect x="0" y="0" width="500" height="720" fill="#123b44"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#fff">
    <text x="58" y="330" font-size="34" font-weight="600">Cada producto con su stock mínimo,</text>
    <text x="58" y="380" font-size="34" font-weight="600">cada movimiento con su responsable.</text>
    <text x="58" y="660" font-size="16" fill="#d5dee1">Ilustración de referencia · datos ficticios</text>
  </g>
  <rect x="500" y="0" width="780" height="720" fill="#f2f5f6"/>
  <rect x="690" y="115" width="410" height="490" rx="12" fill="#fff" stroke="#d5dee1"/>
  <rect x="728" y="155" width="38" height="38" rx="8" fill="#0e7c86"/>
  <path d="M738 182h18m-18-9h14m-14-9h18" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="780" y="182" font-family="Segoe UI, Arial" font-size="26" font-weight="700" fill="#123b44">BrisaStock</text>
  <text x="728" y="244" font-family="Segoe UI, Arial" font-size="28" font-weight="700" fill="#15262b">Inicia sesión</text>
  <text x="728" y="273" font-family="Segoe UI, Arial" font-size="15" fill="#51666c">Usa las credenciales que te dio el administrador.</text>
  <text x="728" y="325" font-family="Segoe UI, Arial" font-size="15" font-weight="600" fill="#15262b">Usuario</text>
  <rect x="728" y="338" width="334" height="46" rx="6" fill="#fff" stroke="#aebdc1"/>
  <text x="728" y="423" font-family="Segoe UI, Arial" font-size="15" font-weight="600" fill="#15262b">Contraseña</text>
  <rect x="728" y="436" width="334" height="46" rx="6" fill="#fff" stroke="#aebdc1"/>
  <rect x="728" y="508" width="334" height="48" rx="6" fill="#0e7c86"/>
  <text x="895" y="538" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" font-weight="700" fill="#fff">Entrar</text>
  <text x="895" y="585" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#0a626a">Letra más grande y otras opciones</text>
</svg>
